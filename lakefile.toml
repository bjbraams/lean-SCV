name = "Main"
version = "0.2.0"
defaultTargets = ["Main"]
buildDir = ".lake/build-SCV"

[leanOptions]
# Mathlib convention: undeclared names in statements are errors, not auto-bound implicits.
autoImplicit = false
relaxedAutoImplicit = false

[[lean_lib]]
name = "Main"
roots = ["SeveralComplexVariables"]
globs = [
  "SeveralComplexVariables", "SeveralComplexVariables.+"
]

[[lean_lib]]
name = "ComplexAnalysis"
globs = ["ComplexAnalysis.+"]

[[lean_lib]]
name = "ToMathlib"
roots = ["ToMathlib.Algebra", "ToMathlib.Analysis", "ToMathlib.Topology"]
globs = ["ToMathlib.+"]

# Palomar registry: statement file (Mathlib only) and its proofs from the library.
[[lean_lib]]
name = "Challenge"

[[lean_lib]]
name = "Solution"

[[lean_exe]]
name = "main"
root = "Main"

[[require]]
name = "mathlib"
scope = "leanprover-community"
# Shared upgrade snapshot, 2026-10-18: Lean v4.36.0-rc1.
rev = "911003dd6dea5df215dff57f2717be762e11a6ca"

[[require]]
name = "TauCeti"
git = "https://github.com/TauCetiProject/TauCeti"
rev = "5cdecf40e99d5a5ad0833afff31f5b007d68a149"
