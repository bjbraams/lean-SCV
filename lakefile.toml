name = "Main"
version = "0.2.0"
defaultTargets = ["Main"]
buildDir = ".lake/build-SCV"

[[lean_lib]]
name = "Main"
roots = ["SeveralComplexVariables"]
globs = [
  "SeveralComplexVariables", "SeveralComplexVariables.+"
]

[[lean_lib]]
name = "ComplexAnalysis"
globs = ["ComplexAnalysis.+"]

[[lean_lib]]
name = "ToMathlib"
roots = ["ToMathlib.Algebra", "ToMathlib.Analysis", "ToMathlib.Topology"]
globs = ["ToMathlib.+"]

# Palomar registry: statement file (Mathlib only) and its proofs from the library.
[[lean_lib]]
name = "Challenge"

[[lean_lib]]
name = "Solution"

[[lean_exe]]
name = "main"
root = "Main"

[[require]]
name = "mathlib"
scope = "leanprover-community"
# rc3 theorem sources, with dependency updates matching TauCeti a780c7ad6beb.
rev = "5e0c4e5239cb0a2d86d68a884bf52cfd963fce22"

[[require]]
name = "TauCeti"
git = "https://github.com/TauCetiProject/TauCeti"
rev = "a780c7ad6beb23f60a17351a492d177878020ad5"
