    relationship: adapts
    location: "Chapters I and II; II.2 for the Levi form, Levi's theorem (Theorem 2.11) and the Levi polynomial (Proposition 2.16); II.3.6 for Cartan-Thullen; I.2.3-2.4 for the implicit and inverse mapping theorems"
  - title: "An Introduction to Complex Analysis in Several Variables"
    authors: [Lars Hörmander]
    type: book
    id: "2nd edition, North-Holland Mathematical Library 7, North-Holland, 1973"
    relationship: adapts
    location: "Chapter II: Section 2.3 (Ehrenpreis' proof of Hartogs' extension theorem), Section 2.5 (Thullen's lemma, Cartan-Thullen, Bochner's tube theorem 2.5.10), Theorem 2.6.5, Section 2.7 (Runge domains); Theorem 1.2.1 (Cauchy-Pompeiu)"
  - title: "From Holomorphic Functions to Complex Manifolds"
    authors: [Klaus Fritzsche, Hans Grauert]
    type: book
    id: "Graduate Texts in Mathematics 213, Springer, 2002"
    relationship: adapts
    location: "Chapter I (identity theorem I.4.10, maximum principle I.4.11, injective maps I.8.5-8.6); Chapter II, Sections 1-6; Chapter III, Sections 1-3"
  - title: "Lectures on Holomorphic Functions of Several Complex Variables"
    authors: [Piotr Jakóbczak, Marek Jarnicki]
    type: other
    id: "Jagiellonian University manuscript, 1997-2021"
    relationship: adapts
    location: "Chapters 1 and 2 (Weierstrass division Theorem 1.7.3, germs Section 1.8, Cartan-Thullen Section 2.7); Sections 4.2-4.3 (Hartogs' extension theorem, Runge domains)"
  - title: "Introduction to Complex Analysis in Several Variables"
    authors: [Volker Scheidemann]
    type: book
    id: "Birkhäuser, 2005"
    relationship: adapts
    location: "Chapters 1-7 and Sections 8.1-8.3; Chapter 6 for tube domains; Section 7.3 for Cartan-Thullen"
  - title: "Several Complex Variables"
    authors: [Jaap Korevaar, Jan Wiegerinck]
    type: other
    id: "University of Amsterdam lecture notes, version of 23 August 2017"
    relationship: adapts
    location: "Chapters 1-6, selectively; Section 1.7 (Runge theory), Theorem 2.6.1 (Hartogs' continuity theorem), Exercise 6.28 (prism lemma)"
  - title: "Lecture Notes on Several Complex Variables"
    authors: [Harold P. Boas]
    type: other
    id: "Draft of 3 December 2013"
    relationship: adapts
    location: "Chapters 1-3 and Sections 4.1-4.2; Section 2.4 for Hartogs' extension theorem"
  - title: "Complex Analytic Geometry: From the Localization Viewpoint"
    authors: [Tatsuo Suwa]
    type: book
    id: "World Scientific, 2024"
    relationship: adapts
    location: "Chapter 1; Section 1.4, Propositions 1.5-1.7, for the ring of analytic germs"
  - title: "Introduction to Complex Analysis, Part II: Functions of Several Variables"
    authors: [Boris V. Shabat]
    type: book
    id: "Translations of Mathematical Monographs 110, American Mathematical Society, 1991"
    relationship: background
    location: "Chapter I, Section 1.2 (Hartogs domains)"
  - title: "Tasty Bits of Several Complex Variables: A Whirlwind Tour of the Subject"
    authors: [Jiří Lebl]
