automation:
  methods:
    - method: agent
      framework: Codex
    - method: agent
      framework: Claude Code
      models: ["claude-fable-5-1"]
      prompting_notes: >-
        Used for a Mathlib-style review and refactoring of the library and for preparing
        Challenge.lean, Solution.lean, comparator.json and this file.
  notes: >-
    Human-directed, agent-assisted mathematical development, proof writing, debugging and review,
    validated throughout by Lean builds. The author chose the material, the conventions and the
    sources and directed the work; coding agents wrote most of the Lean text. Historical model
    versions and per-session costs are not reconstructed here. Challenge.lean is generated from
    Solution.lean by the script make_challenge.py, which removes the import of the library and the
    bridging lemmas and replaces every proof by sorry, so that the statements and definitions of
    the two files are textually identical.

fidelity:
  divergences: >-
    Statements are phrased with Mathlib's predicates rather than those of any one source.
    (1) Holomorphic is DifferentiableOn over the complex numbers and analytic is AnalyticOnNhd; they
    agree on open subsets of finite-dimensional spaces (item 3), and hypotheses use whichever the
    library proves directly. (2) Coordinate spaces carry the supremum norm, so metric balls are
    polydiscs; the hull-radius form of Thullen's lemma (item 55) is for this norm. (3) Domains are
    not assumed connected or nonempty unless stated; dimension zero and empty index types are
    included. (4) Holomorphic and polynomial hulls are defined through all real upper bounds
    instead of suprema. (5) The domain-of-holomorphy property requires agreement on a fixed
    nonempty open overlap, not on a component of the intersection. (6) Subharmonic and
    plurisubharmonic functions are real valued: the value minus infinity is not admitted, so for
    example log|f| is covered only for nonvanishing f. (7) Pseudoconvex means open with a continuous
    plurisubharmonic exhaustion function; the Levi problem is not addressed. (8) The Levi condition
    quantifies over all local C^2 defining functions, and independence of the choice is a theorem
    (item 64). (9) The second Riemann extension theorem (item 35) assumes an explicit slice
    condition for codimension at least two instead of a dimension theory. (10) Runge domains are
    not required to be domains of holomorphy. (11) Montel's theorem (item 12) is compared in its
    sequential form for a uniform bound; Laurent expansion (item 22) as existence and uniqueness of
    the coefficient family. (12) Several theorems are more general than in the sources: Banach
    space values, arbitrary finite-dimensional complex normed spaces, and strictly convex targets
    in the maximum modulus principle.

review:
  status: agent-reviewed
  notes: >-
    The library, Challenge.lean and Solution.lean build with Lean 4.34.0 and the pinned Mathlib
    without errors, warnings or sorry in the library. The compared declarations use only propext,
    Quot.sound and Classical.choice. The declarations of Challenge.lean, including all auxiliary
    definitions, were checked to have the same types and values in the Solution environment by
    comparing expression hashes, which emulates Comparator's declaration check. An official
    Comparator and NanoDa run and Palomar's editorial review are pending. No independent human
    peer review is claimed.
