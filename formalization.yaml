related_formalizations:
  - id: https://github.com/leanprover-community/mathlib4
    relationship: builds-on
    note: >-
      The development uses Mathlib throughout, in particular its one-variable Cauchy theory, torus
      integrals, analytic functions, the analytic identity principle, the local maximum modulus
      principle, circle averages and the Laplacian. Mathlib's formal Weierstrass preparation theorem
      for power series over complete local rings is not used; the analytic division and
      preparation theorems here are proved for convergent germs.

