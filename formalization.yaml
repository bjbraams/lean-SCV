version: "v0.4"

project:
  name: "Several complex variables: local theory, Hartogs phenomena, Weierstrass theory, domains of holomorphy and pseudoconvexity"
  description: >-
    A Lean 4 formalization, on top of Mathlib, of the classical function theory of several complex
    variables on open subsets of finite-dimensional complex normed spaces, with values in complex
    Banach spaces wherever the statements allow. The compared statements cover: Cauchy's integral
    formula on polydiscs, Osgood's lemma, the equivalence of holomorphy and analyticity, the
    Cauchy-Riemann equations, Cauchy estimates, the identity theorem, the maximum modulus
    principle, holomorphic dependence of integrals and the Cauchy-Pompeiu identity; the theorems
    of Weierstrass, Montel and Vitali and an estimate for holomorphic L^p classes; the holomorphic
    inverse and implicit mapping theorems; Reinhardt domains, logarithmic convexity, the
    characterization of convergence domains of power series, Laurent expansion, and continuation
    from Reinhardt and circular domains; Hartogs-Taylor expansion, Hartogs' continuity theorem,
    Hartogs' theorem on separate analyticity, removability of isolated singularities, the two
    Riemann extension theorems and Hartogs' extension theorem for compact holes; elementary
    analytic sets and their regular points; the local ring of analytic germs, Weierstrass division
    and preparation, and the Noetherian and unique factorization properties of the germ ring;
    injective holomorphic maps, Cartan's uniqueness theorem, linearity of biholomorphisms of
    circular domains, transitivity of the automorphisms of the ball and the inequivalence of ball
    and polydisc; holomorphic hulls, domains of holomorphy, Thullen's lemma, the Cartan-Thullen
    theorem and Bochner's tube theorem; subharmonic and plurisubharmonic functions, the Levi form,
    pseudoconvexity of domains of holomorphy, Levi's theorem and local peak functions; Runge
    domains and polynomial hulls. All results are classical; none is claimed to be new.
  authors:
    - Bastiaan J Braams
  responsible_maintainers:
    - Bastiaan J Braams
  license: Apache-2.0

